<title>국밥이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: one centered stage (character) with a speech bubble, action buttons below, a small profile card */
  :root {
    --bg: #eaefe6;          /* pale scallion grey */
    --surface: #ffffff;
    --ink: #2a201b;
    --muted: #6b605a;
    --accent: #3d8a48;      /* scallion green */
    --accent-ink: #ffffff;
    --line: #d6dccf;
    --stage: #f7f9f4;
    --display: "Jua", "Gowun Dodum", system-ui, sans-serif;
    --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1916; --surface: #26221e; --ink: #f2ebe4; --muted: #b3a89f;
      --accent: #7cc387; --accent-ink: #13200f; --line: #3a332d; --stage: #2e2924;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1916; --surface: #26221e; --ink: #f2ebe4; --muted: #b3a89f;
    --accent: #7cc387; --accent-ink: #13200f; --line: #3a332d; --stage: #2e2924;
    color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 48px;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
  header { display: grid; gap: 4px; text-align: center; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 2.6rem; line-height: 1.1; margin: 0; text-wrap: balance; }
  .tag { color: var(--muted); margin: 0; }

  .stage {
    position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 24px;
    padding: 72px 12px 8px; display: grid; justify-items: center;
  }
  .bubble {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--surface); color: var(--ink); border: 2px solid var(--ink); border-radius: 16px;
    padding: 6px 14px; font-family: var(--display); font-size: 1.1rem; white-space: nowrap; max-width: calc(100% - 24px);
    overflow: hidden; text-overflow: ellipsis;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; transform: translateX(-50%) rotate(45deg);
    background: var(--surface); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  }
  .bubble.pop { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: translateX(-50%) scale(.6); } 70% { transform: translateX(-50%) scale(1.08); } 100% { transform: translateX(-50%) scale(1); } }

  svg.char { width: min(320px, 100%); height: auto; cursor: pointer; overflow: visible; }
  svg.char:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; border-radius: 16px; }

  /* character parts */
  .char * { transform-box: fill-box; }
  .body { transform-origin: 50% 100%; animation: bob 2.4s ease-in-out infinite; }
  .shadow { transform-origin: 50% 50%; animation: shadow 2.4s ease-in-out infinite; }
  .eyes { transform-origin: 50% 50%; animation: blink 4.2s infinite; }
  .sprout { transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite; }
  .arm-r { transform-origin: 0% 60%; }
  .arm-l { transform-origin: 100% 40%; animation: stir 2.4s ease-in-out infinite; }
  .steam path { opacity: 0; animation: steam 2.8s ease-in infinite; }
  .steam path:nth-child(2) { animation-delay: .9s; }
  .steam path:nth-child(3) { animation-delay: 1.8s; }
  .broth { fill: var(--broth, #f1e2c6); transition: fill .6s; }
  .char.red { --broth: #d4532c; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes shadow { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.9); } }
  @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  @keyframes stir { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-8deg); } }
  @keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 30% { opacity: .75; } 100% { opacity: 0; transform: translateY(-46px); } }

  /* face variants */
  .face-happy, .face-hot, .sweat { display: none; }
  .char.happy .face-normal, .char.hot .face-normal { display: none; }
  .char.happy .face-happy { display: inline; }
  .char.hot .face-hot, .char.hot .sweat { display: inline; }
  .cheek { transition: fill .3s; }
  .char.hot .cheek { fill: #ff5a4a; }
  .char.hot .steam path { animation-duration: 1.1s; stroke-width: 7; }

  /* actions */
  .char.wave .arm-r { animation: wave .35s ease-in-out 4 alternate; }
  @keyframes wave { from { transform: rotate(10deg); } to { transform: rotate(-40deg); } }
  .char.jump .body { animation: jump .8s cubic-bezier(.3,.7,.4,1) 2; }
  .char.jump .shadow { animation: jumpshadow .8s cubic-bezier(.3,.7,.4,1) 2; }
  @keyframes jump {
    0% { transform: translateY(0) scale(1,1); }
    18% { transform: translateY(0) scale(1.08,.9); }
    50% { transform: translateY(-60px) scale(.95,1.06); }
    82% { transform: translateY(0) scale(1.07,.93); }
    100% { transform: translateY(0) scale(1,1); }
  }
  @keyframes jumpshadow { 0%,18%,82%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.6); opacity: .5; } }
  .char.hot .body { animation: shake .12s linear infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .kkakdugi { opacity: 0; }
  .char.feed .kkakdugi { animation: toss .7s cubic-bezier(.4,0,.6,1) forwards; }
  @keyframes toss {
    0% { opacity: 1; transform: translate(130px, -120px) rotate(0); }
    60% { opacity: 1; transform: translate(40px, -150px) rotate(200deg); }
    100% { opacity: 0; transform: translate(0, 0) rotate(360deg) scale(.4); }
  }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .actions button {
    font-family: var(--display); font-size: 1.05rem; padding: 10px 16px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
    transition: transform .1s, background .2s;
  }
  .actions button:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .actions button:active { transform: translateY(2px); }
  .actions button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .profile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; }
  .profile h2 { font-family: var(--display); font-weight: 400; font-size: 1.3rem; margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); letter-spacing: .02em; }
  dd { margin: 0; min-width: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .hint { text-align: center; color: var(--muted); font-size: .9rem; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .char *, .bubble { animation: none !important; }
    .steam path { opacity: .5; }
  }
</style>

<div class="wrap">
  <header>
    <h1>국밥이</h1>
    <p class="tag">뚝배기에서 태어난 뜨끈한 친구</p>
  </header>

  <section class="stage" aria-label="국밥이 캐릭터">
    <div class="bubble" id="bubble" aria-live="polite">안녕! 나는 국밥이야</div>

    <svg class="char" id="char" viewBox="0 0 300 310" role="img" aria-label="뚝배기 국밥 캐릭터, 누르면 반응해요" tabindex="0">
      <ellipse class="shadow" cx="150" cy="292" rx="96" ry="10" fill="#000" fill-opacity=".14"/>

      <g class="body">
        <!-- steam -->
        <g class="steam" fill="none" stroke="#c9c9c9" stroke-width="5" stroke-linecap="round" stroke-opacity=".9">
          <path d="M112 120 q-10 -14 0 -28 q10 -14 0 -28"/>
          <path d="M150 112 q-10 -14 0 -28 q10 -14 0 -28"/>
          <path d="M188 120 q-10 -14 0 -28 q10 -14 0 -28"/>
        </g>

        <!-- spoon + left arm -->
        <g class="arm-l">
          <rect x="16" y="120" width="7" height="110" rx="3.5" fill="#b9bdc2"/>
          <ellipse cx="19.5" cy="116" rx="12" ry="17" fill="#d3d7db"/>
          <path d="M50 196 q-22 4 -28 22" fill="none" stroke="#4a2a1f" stroke-width="12" stroke-linecap="round"/>
          <circle cx="20" cy="220" r="9" fill="#ffd9b8" stroke="#4a2a1f" stroke-width="3"/>
        </g>

        <!-- right arm -->
        <g class="arm-r">
          <path d="M252 196 q22 -4 30 -24" fill="none" stroke="#4a2a1f" stroke-width="12" stroke-linecap="round"/>
          <circle cx="283" cy="170" r="9" fill="#ffd9b8" stroke="#4a2a1f" stroke-width="3"/>
        </g>

        <!-- bowl foot -->
        <rect x="98" y="262" width="104" height="18" rx="6" fill="#3d231a"/>
        <!-- bowl body -->
        <path d="M38 150 Q40 252 104 270 L196 270 Q260 252 262 150 Z" fill="#5b3326"/>
        <path d="M58 172 Q66 236 110 254" fill="none" stroke="#7a4836" stroke-width="6" stroke-linecap="round" opacity=".7"/>
        <!-- rim -->
        <ellipse cx="150" cy="150" rx="114" ry="24" fill="#704031"/>
        <ellipse class="broth" cx="150" cy="150" rx="100" ry="17"/>

        <!-- toppings -->
        <ellipse cx="118" cy="148" rx="16" ry="6" fill="#e9b3a0"/>
        <ellipse cx="170" cy="153" rx="14" ry="5" fill="#e2a690"/>
        <g fill="#5fae55" stroke="#2f6b2c" stroke-width="1.5">
          <circle cx="140" cy="142" r="4"/><circle cx="196" cy="146" r="3.5"/>
          <circle cx="98" cy="154" r="3.5"/><circle cx="150" cy="157" r="3"/>
        </g>

        <!-- scallion sprout -->
        <g class="sprout">
          <path d="M182 150 C186 120 180 96 196 70" fill="none" stroke="#4fa34a" stroke-width="10" stroke-linecap="round"/>
          <path d="M182 150 C184 136 183 128 184 120" fill="none" stroke="#eef3e2" stroke-width="10" stroke-linecap="round"/>
          <path d="M194 74 C206 64 214 66 220 58" fill="none" stroke="#4fa34a" stroke-width="7" stroke-linecap="round"/>
        </g>

        <!-- face -->
        <g class="face-normal">
          <g class="eyes">
            <ellipse cx="114" cy="204" rx="11" ry="14" fill="#fff"/>
            <ellipse cx="186" cy="204" rx="11" ry="14" fill="#fff"/>
            <circle cx="116" cy="207" r="7" fill="#1d1411"/>
            <circle cx="188" cy="207" r="7" fill="#1d1411"/>
            <circle cx="119" cy="203" r="2.5" fill="#fff"/>
            <circle cx="191" cy="203" r="2.5" fill="#fff"/>
          </g>
          <path d="M136 226 Q150 242 164 226" fill="none" stroke="#1d1411" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g class="face-happy" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
          <path d="M102 208 Q114 192 126 208"/>
          <path d="M174 208 Q186 192 198 208"/>
          <path d="M134 224 Q150 250 166 224 Z" fill="#c2463a" stroke="#1d1411" stroke-width="4"/>
        </g>
        <g class="face-hot" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M104 196 L122 205 L104 214"/>
          <path d="M196 196 L178 205 L196 214"/>
          <ellipse cx="150" cy="232" rx="9" ry="11" fill="#c2463a" stroke="#1d1411" stroke-width="4"/>
        </g>
        <ellipse class="cheek" cx="92" cy="226" rx="12" ry="7" fill="#e8796a" opacity=".85"/>
        <ellipse class="cheek" cx="208" cy="226" rx="12" ry="7" fill="#e8796a" opacity=".85"/>
        <path class="sweat" d="M232 176 q8 12 0 18 q-8 -6 0 -18 Z" fill="#8fd0ff"/>

        <!-- kkakdugi tossed into mouth -->
        <rect class="kkakdugi" x="141" y="222" width="18" height="18" rx="3" fill="#e5532f" stroke="#a8341b" stroke-width="2"/>
      </g>
    </svg>
  </section>

  <div class="actions">
    <button type="button" id="btn-wave">인사하기</button>
    <button type="button" id="btn-jump">점프</button>
    <button type="button" id="btn-feed">깍두기 주기</button>
    <button type="button" id="btn-hot">불 올리기</button>
    <button type="button" id="btn-red" aria-pressed="false">다대기 넣기</button>
  </div>
  <p class="hint">국밥이를 직접 눌러도 반응해요</p>

  <section class="profile" aria-labelledby="profile-title">
    <h2 id="profile-title">국밥이 프로필</h2>
    <dl>
      <dt>고향</dt><dd>뚝배기 (지름 <span class="num">16cm</span>)</dd>
      <dt>체온</dt><dd class="num">98°C, 언제나 펄펄</dd>
      <dt>단짝</dt><dd>깍두기, 새우젓, 부추무침</dd>
      <dt>특기</dt><dd>해장, 든든한 한 끼, 마음 데우기</dd>
      <dt>약점</dt><dd>식으면 기운이 빠짐</dd>
    </dl>
  </section>
</div>

<script>
  const char = document.getElementById('char');
  const bubble = document.getElementById('bubble');
  const ACTIONS = ['wave', 'jump', 'feed', 'hot', 'happy'];
  let timer;

  function say(text) {
    bubble.textContent = text;
    bubble.classList.remove('pop');
    void bubble.offsetWidth;
    bubble.classList.add('pop');
  }

  function act(classes, text, ms) {
    clearTimeout(timer);
    char.classList.remove(...ACTIONS);
    void char.getBoundingClientRect();
    char.classList.add(...classes);
    say(text);
    timer = setTimeout(() => char.classList.remove(...ACTIONS), ms);
  }

  const moves = {
    wave: () => act(['wave', 'happy'], '안녕! 나는 국밥이야', 1500),
    jump: () => act(['jump', 'happy'], '오늘도 든든하게 한 그릇!', 1700),
    feed: () => {
      act(['feed'], '냠...', 1600);
      setTimeout(() => { char.classList.add('happy'); say('깍두기랑 먹으면 최고야!'); }, 700);
    },
    hot: () => act(['hot'], '앗 뜨거! 후후 불어 먹어', 1800),
  };

  document.getElementById('btn-wave').onclick = moves.wave;
  document.getElementById('btn-jump').onclick = moves.jump;
  document.getElementById('btn-feed').onclick = moves.feed;
  document.getElementById('btn-hot').onclick = moves.hot;

  const redBtn = document.getElementById('btn-red');
  redBtn.onclick = () => {
    const red = char.classList.toggle('red');
    redBtn.setAttribute('aria-pressed', String(red));
    redBtn.textContent = red ? '다대기 빼기' : '다대기 넣기';
    act(['happy'], red ? '칼칼하게 변신 완료!' : '다시 뽀얀 국물로!', 1400);
  };

  const keys = Object.keys(moves);
  const poke = () => moves[keys[Math.floor(Math.random() * keys.length)]]();
  char.addEventListener('click', poke);
  char.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(); } });
</script>
